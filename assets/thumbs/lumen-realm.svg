<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Lumen Realm – Abenteuer im Reich des Lichts</title><desc id="desc">Ein pixelartiger Held steht vor einem leuchtenden Kristall, einem Dorf, uralten Ruinen, Bergen und einer geheimnisvollen Dungeon-Pforte.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#14284e"/><stop offset=".52" stop-color="#496b83"/><stop offset="1" stop-color="#f2a45f"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#6d9b59"/><stop offset="1" stop-color="#254d3c"/></linearGradient>
 <linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#efff9c"/><stop offset=".45" stop-color="#9dff57"/><stop offset="1" stop-color="#24a878"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#d9ff76" stop-opacity=".85"/><stop offset="1" stop-color="#b6ff58" stop-opacity="0"/></radialGradient>
 <linearGradient id="title" x2="0" y2="1"><stop stop-color="#fff6bd"/><stop offset=".48" stop-color="#ffd36c"/><stop offset="1" stop-color="#c8792e"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="pixels" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32M31.5 0V32" stroke="#fff" stroke-opacity=".06"/></pattern>
