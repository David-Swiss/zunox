<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Schach — ZUNOX</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#18232e;--line:#2b3946;--muted:#9aa9b6;--accent:#8bc5a1;--light:#e8eee7;--dark:#789487}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3f0;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.top{height:58px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1050px)/2));background:#121c25}
.brand{font-size:19px;font-weight:900;letter-spacing:1px;color:#dff5e5;text-decoration:none}.brand span{color:var(--accent)}.back{color:#b5c4bf;text-decoration:none;font-weight:650}
main{width:min(1000px,calc(100% - 28px));margin:30px auto 50px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.heading h1{font-size:26px;margin:0;letter-spacing:-.8px}.heading p{margin:3px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0, min( min(66vw,620px), calc(100vh - 230px))) minmax(250px,1fr);gap:20px;align-items:start}
.game{min-width:0}.player{height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;color:#e4ece7}.avatar{width:27px;height:27px;border-radius:8px;background:#2b3b43;display:grid;place-items:center}.player small{color:var(--muted);margin-left:auto}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:5px solid #26342f;border-radius:5px;overflow:hidden;box-shadow:0 12px 34px #0004;touch-action:manipulation}
.sq{border:0;padding:0;position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:1;font-family:"Segoe UI Symbol","DejaVu Sans",serif;font-size:clamp(26px,5.8vw,58px);line-height:1;cursor:pointer;color:#f8faf8;text-shadow:0 2px 3px #0005}
.sq.light{background:var(--light);color:#f9fbf9}.sq.dark{background:var(--dark)}.sq.selected{box-shadow:inset 0 0 0 4px #e4dc62}.sq.last{background-image:linear-gradient(#d7e87966,#d7e87966)}.sq.legal:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#172e2360}.sq.capture:after{content:"";position:absolute;inset:4%;border:4px solid #172e2360;border-radius:50%}.coord{position:absolute;font:10px system-ui;opacity:.8;left:4px;top:2px;text-shadow:none;color:#26342f}.dark .coord{color:#f5f5ed}.piece{position:relative;z-index:1;filter:drop-shadow(0 1px 1px #0005)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px}.panel h2{font-size:15px;margin:0 0 12px}.status{padding:12px;background:#202e38;border-radius:9px;font-weight:700;margin-bottom:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #3b4b56;background:#24333e;color:#e8f0eb;border-radius:8px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#8bc5a1;border-color:#8bc5a1;color:#122019}.btn:disabled{opacity:.4;cursor:not-allowed}.settings{margin-top:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}select{background:#202e38;color:#f1f5f2;border:1px solid #3a4b55;border-radius:8px;padding:8px;font:inherit}.moves{margin-top:15px;max-height:250px;overflow:auto;background:#121c25;border-radius:9px;padding:9px;display:grid;grid-template-columns:38px 1fr 1fr;gap:3px 6px;font-variant-numeric:tabular-nums}.moves span{padding:5px 4px;border-radius:5px}.num{color:#82948c}.active{background:#34483f}.hint{font-size:12px;color:var(--muted);margin:12px 2px 0}.promotion{display:none;gap:6px;margin:10px 0}.promotion button{flex:1;font-size:25px;padding:5px}
@media(max-width:760px){main{margin:20px auto 35px}.heading{align-items:start}.layout{grid-template-columns:1fr;gap:12px}.panel{padding:12px}.moves{max-height:150px}.board{max-width:min(100%,620px);margin:auto}.player{max-width:620px;margin:auto}.heading p{font-size:12px}}
</style></head><body>
<header class="top"><a class="brand" href="../">ZUNO<span>X</span></a><a class="back" href="../">← Alle Spiele</a></header>
<main><div class="heading"><div><h1>Schach</h1><p>Eine ruhige Partie. Ein Zug nach dem anderen.</p></div></div>
<div class="layout"><section class="game"><div class="player"><span class="avatar">♟</span><b>Computer</b><small id="botlabel">Schwarz · Mittel</small></div><div id="board" class="board" aria-label="Schachbrett"></div><div class="player"><span class="avatar">♙</span><b>Du</b><small>Weiss</small></div></section>
<aside class="panel"><h2>Deine Partie</h2><div class="status" id="status">Du bist am Zug.</div><div class="actions"><button class="btn primary" id="new">Neue Partie</button><button class="btn" id="undo">Zug zurück</button></div><div class="settings"><label for="level">Bot-Stärke</label><select id="level"><option value="1">Leicht</option><option value="2" selected>Mittel</option><option value="3">Schwer</option></select></div><div class="promotion" id="promotion"></div><h2 style="margin-top:18px">Zugverlauf</h2><div class="moves" id="moves"><span class="num">—</span><span>Neue Partie starten</span></div><p class="hint">Figur antippen und Zielfeld wählen. Auf dem Handy funktioniert das genauso. Rochade, en passant und Umwandlung sind aktiv.</p></aside></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.4.0/chess.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),board=$('#board'),status=$('#status'),movesEl=$('#moves'),level=$('#level'),promotion=$('#promotion');
if(!window.Chess){status.textContent='Schachregeln konnten nicht geladen werden. Bitte Seite neu laden.';return;}
let game=new Chess(),selected=null,targets=[],history=[],busy=false,last=null;
const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
const files='abcdefgh',value={p:100,n:320,b:335,r:500,q:900,k:0};
function draw(){
 board.innerHTML='';const legal=game.moves({verbose:true});
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const sq=files[c]+(8-r),p=game.get(sq),b=document.createElement('button');b.className='sq '+((r+c)%2?'dark':'light');b.type='button';b.dataset.sq=sq;
  if(last&& (last.from===sq||last.to===sq))b.classList.add('last');if(selected===sq)b.classList.add('selected');
  if(targets.includes(sq))b.classList.add(p?'capture':'legal');
  if(c===0){const n=document.createElement('span');n.className='coord';n.textContent=8-r;b.append(n)}
  if(r===7){const n=document.createElement('span');n.className='coord';n.style.left='auto';n.style.right='4px';n.style.top='auto';n.style.bottom='2px';n.textContent=files[c];b.append(n)}
  if(p){const s=document.createElement('span');s.className='piece';s.textContent=glyph[p.color+p.type];b.append(s)}
  b.addEventListener('click',()=>tap(sq));board.append(b);
 }
 update();
}
function update(){
 const turn=game.turn()==='w'?'Weiss':'Schwarz';
 status.textContent=game.isCheckmate()?'Schachmatt — '+(game.turn()==='w'?'Computer':'Du')+' gewinnt.':game.isDraw()?'Remis.':game.isCheck()?'Schach! '+turn+' ist am Zug.':turn+' am Zug.';
 $('#undo').disabled=game.history().length===0||busy;
 movesEl.innerHTML='';const h=game.history();if(!h.length){movesEl.innerHTML='<span class="num">—</span><span>Partie bereit</span>';return;}
 for(let i=0;i<h.length;i+=2){const n=document.createElement('span');n.className='num';n.textContent=(i/2+1)+'.';const w=document.createElement('span');w.textContent=h[i];const b=document.createElement('span');b.textContent=h[i+1]||'';movesEl.append(n,w,b);}
 movesEl.scrollTop=movesEl.scrollHeight;
}
function tap(sq){
 if(busy||game.isGameOver()||game.turn()!=='w')return;
 const p=game.get(sq);
 if(selected&&targets.includes(sq)){
  const opts=game.moves({square:selected,verbose:true}).filter(m=>m.to===sq);
  if(opts.some(m=>m.flags.includes('p'))){showPromotion(selected,sq);return;}
  commit({from:selected,to:sq});return;
 }
 if(p&&p.color==='w'){selected=sq;targets=game.moves({square:sq,verbose:true}).map(m=>m.to);}
 else {selected=null;targets=[];}
 draw();
}
function showPromotion(from,to){promotion.style.display='flex';promotion.innerHTML='';for(const [t,s] of [['q','♕'],['r','♖'],['b','♗'],['n','♘']]){const b=document.createElement('button');b.className='btn';b.textContent=s;b.onclick=()=>{promotion.style.display='none';commit({from,to,promotion:t});};promotion.append(b);}}
function commit(m){const result=game.move(m);if(!result)return;last={from:result.from,to:result.to};selected=null;targets=[];draw();if(!game.isGameOver())setTimeout(botMove,180);}
function evaluate(g){if(g.isCheckmate())return g.turn()==='w'?-100000:100000;let score=0;const b=g.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;let v=value[p.type];const center=3.5-(Math.abs(3.5-r)+Math.abs(3.5-c))/2;if(p.type==='n'||p.type==='b')v+=center*9;if(p.type==='p')v+=(p.color==='w'?(6-r):(r-1))*5;score+=(p.color==='w'?v:-v);}return score;}
function minimax(g,depth,alpha,beta,maximizing){
 if(depth===0||g.isGameOver())return evaluate(g);
 const ms=g.moves({verbose:true});ms.sort((a,b)=>(b.captured?value[b.captured]:0)-(a.captured?value[a.captured]:0));
 if(maximizing){let best=-Infinity;for(const m of ms){g.move(m);best=Math.max(best,minimax(g,depth-1,alpha,beta,false));g.undo();alpha=Math.max(alpha,best);if(beta<=alpha)break;}return best;}
 let best=Infinity;for(const m of ms){g.move(m);best=Math.min(best,minimax(g,depth-1,alpha,beta,true));g.undo();beta=Math.min(beta,best);if(beta<=alpha)break;}return best;
}
function botMove(){
 if(game.isGameOver()||game.turn()!=='b')return;busy=true;update();
 const ms=game.moves({verbose:true}),depth=Number(level.value),ranked=[];
 for(const m of ms){game.move(m);const score=minimax(game,depth-1,-Infinity,Infinity,true);game.undo();ranked.push({m,score:score+(Math.random()-.5)*(depth===1?120:depth===2?45:12)});}
 ranked.sort((a,b)=>a.score-b.score);const choice=ranked[0]?.m;
 if(choice){const x=game.move(choice);last={from:x.from,to:x.to};}
 busy=false;selected=null;targets=[];draw();
}
$('#new').onclick=()=>{game=new Chess();selected=null;targets=[];last=null;busy=false;promotion.style.display='none';draw();};
$('#undo').onclick=()=>{if(busy)return;game.undo();if(game.turn()==='b')game.undo();selected=null;targets=[];last=null;draw();};
level.onchange=()=>$('#botlabel').textContent='Schwarz · '+({1:'Leicht',2:'Mittel',3:'Schwer'}[level.value]);
draw();
})();
</script></body></html>
