let after=nearest(car.x,car.y);if(after.d>currentTrack.w*.47){let nx=after.x-car.x,ny=after.y-car.y,n=Math.hypot(nx,ny)||1;let outward=(car.vx*(-nx/n)+car.vy*(-ny/n));if(outward>0){car.vx+=nx/n*outward*.75;car.vy+=ny/n*outward*.75;}car.vx*=.985;car.vy*=.985;if(after.d>currentTrack.w*.78){car.vx*=.965;car.vy*=.965;}}
let spin=Math.abs(slipAngle);if(spin>1.42){let recovery=Math.min(1,(spin-1.42)*1.3);let velocityAngle=Math.atan2(car.vy,car.vx),headingError=Math.atan2(Math.sin(velocityAngle-car.a),Math.cos(velocityAngle-car.a));car.a+=headingError*recovery*.018;car.vx*=.997;car.vy*=.997;}
if(speed>65&&onRoad&&spin>.13&&spin<1.22&&(Math.abs(steer)>.05||hand||throttle)){let gain=(speed*.025+spin*42)*(hand?1.2:1);comboTimer=1.7;combo=Math.min(5,1+score/2500);score+=gain*combo;for(let side of [-1,1])if(Math.random()<.6)spawn(car.x-fX*20+rX*side*12,car.y-fY*20+rY*side*12,-car.vx*.13+(Math.random()-.5)*24,-car.vy*.13+(Math.random()-.5)*24,PAINTS[smokeColor],8+Math.random()*8,.8+Math.random()*.5);if(Math.random()<.34)skids.push({x:car.x-fX*18,y:car.y-fY*18,a:car.a,life:1});}
else comboTimer=Math.max(0,comboTimer-DT);if(comboTimer===0)combo=1;
if(Math.abs(vLat)>32&&speed>65&&onRoad&&Math.random()<.6){skids.push({x:car.x-fX*20,y:car.y-fY*20,a:car.a,life:1.8});if(skids.length>1000)skids.splice(0,skids.length-1000);}
if(keys.nitro&&car.nitro>0&&nitro>0){vLong+=240*DT;car.nitro=Math.max(0,car.nitro-24*DT);for(let i=0;i<2;i++)spawn(car.x-fX*25+rX*(i?9:-9),car.y-fY*25+rY*(i?9:-9),-fX*(70+Math.random()*40),-fY*(70+Math.random()*40),'#65e9ff',5,.25);}else car.nitro=Math.min(100,car.nitro+5*DT);
if(Math.hypot(car.x-oldX,car.y-oldY)>1){let p=nearest(car.x,car.y);let prog=0;for(let i=0;i<p.index;i++)prog+=world.lengths[i];prog+=world.lengths[p.index]*p.t;if(prog<car.progress- world.total*.55)lap++;car.progress=prog;}
let cpIndex=Math.floor(car.progress/world.total*world.points.length);checkpoint=Math.max(checkpoint,cpIndex);elapsed+=DT;if(mode==='challenge'){challengeLeft-=DT;if(challengeLeft<=0)finishRace();}if(mode==='time'&&lap>=1)finishRace();if(mode==='race'&&lap>=1)finishRace();
if(mode==='race'){for(let i=0;i<ai.length;i++){let bot=ai[i];bot.progress+=bot.v*DT;let p=pointAtDistance(bot.progress);bot.x=p.x;bot.y=p.y;bot.a=p.a;}}
for(let p of particles){p.x+=p.vx*DT;p.y+=p.vy*DT;p.vx*=.985;p.vy*=.985;p.life-=DT;}particles=particles.filter(p=>p.life>0);for(let m of skids)m.life-=DT*.17;skids=skids.filter(m=>m.life>0);if(particles.length>650)particles.length=650;
if(Math.hypot(car.x-oldX,car.y-oldY)>0){ghost.push({x:car.x,y:car.y,a:car.a});if(ghost.length>10000)ghost.shift();}
if(Math.hypot(car.x-oldX,car.y-oldY)>2&&after.d>currentTrack.w*.56){cam.shake=Math.min(10,cam.shake+3);score=Math.max(0,score-3);}
$('time').textContent=fmt(elapsed*1000);$('score').textContent=Math.floor(score).toLocaleString('de-CH');$('multi').textContent='x'+combo.toFixed(1);$('speed').textContent=Math.round(speed*.55)+' km/h';soundUpdate();}
function finishRace(){if(raceFinished)return;raceFinished=true;running=false;let earned=Math.max(1,Math.floor(score/1200)+(lap>0?2:0));if(mode==='time'&&elapsed<60)earned+=2;stars+=earned;coinsEarned=earned;medals[trackIndex]=Math.max(medals[trackIndex]||0,score>4500?3:score>2000?2:1);if(!unlocked.includes(Math.min(5,trackIndex+1))&&medals[trackIndex]>=2)unlocked.push(Math.min(5,trackIndex+1));try{localStorage.setItem(KEYS.best,String(Math.min(best||Infinity,elapsed*1000)));}catch(e){}saveAll();showResults();}

function drawCarShape(g,x,y,a,color,type,scale=1){g.save();g.translate(x,y);g.rotate(a);g.scale(scale,scale);let [len,wid]=CARS[type].shape;g.fillStyle='#05090e';g.fillRect(-len*.48,-wid*.72,len*.3,wid*.35);g.fillRect(len*.18,-wid*.72,len*.3,wid*.35);g.fillRect(-len*.48,wid*.37,len*.3,wid*.35);g.fillRect(len*.18,wid*.37,len*.3,wid*.35);g.fillStyle=color;g.beginPath();g.moveTo(len*.58,0);g.lineTo(len*.35,-wid*.48);g.lineTo(-len*.38,-wid*.5);g.lineTo(-len*.55,-wid*.28);g.lineTo(-len*.55,wid*.28);g.lineTo(-len*.38,wid*.5);g.lineTo(len*.35,wid*.48);g.closePath();g.fill();g.fillStyle='#102a3c';g.fillRect(-len*.2,-wid*.36,len*.46,wid*.72);g.fillStyle='#bdefff';g.fillRect(len*.18,-wid*.3,len*.13,wid*.6);g.fillStyle='#fff0b5';g.fillRect(len*.48,-wid*.34,3,3);g.fillRect(len*.48,wid*.2,3,3);g.fillStyle='#ff4e60';g.fillRect(-len*.54,-wid*.35,3,3);g.fillRect(-len*.54,wid*.2,3,3);
if(engineLevel>0){g.fillStyle='#c7d2da';g.fillRect(-len*.67,-wid*.38,7+engineLevel*2,3);g.fillRect(-len*.67,wid*.25,7+engineLevel*2,3);if(keys.gas){g.fillStyle='#ff9c43';g.fillRect(-len*.83,-wid*.27,5+engineLevel*2,3);g.fillRect(-len*.83,wid*.18,5+engineLevel*2,3);}}
if(driftKit>0||spoiler>0){g.fillStyle='#111b29';g.fillRect(-len*.5,-wid*.68,len*.28,3);g.fillRect(-len*.5,wid*.5,len*.28,3);}
if(nitro>0){g.fillStyle='#65e9ff';g.fillRect(-len*.58,-wid*.12,4,3);g.fillRect(-len*.58,wid*.02,4,3);}
if(brakes>0){g.fillStyle='#ff566d';g.fillRect(len*.05,-wid*.61,4,3);g.fillRect(len*.05,wid*.42,4,3);}

g.restore();}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);if(!world.points.length)return;let fit=Math.min(vw/1250,vh/1000);if(vw<700)fit=Math.min(fit,.8);let viewW=vw/fit,viewH=vh/fit;let targetX=running?car.x-viewW*.5:Math.max(0,(1250-viewW)*.5),targetY=running?car.y-viewH*.55:Math.max(0,(950-viewH)*.5);cam.x+=(targetX-cam.x)*.075;cam.y+=(targetY-cam.y)*.075;let shake=cam.shake;cam.shake*=.86;ctx.save();ctx.translate(vw/2,vh/2);ctx.scale(fit,fit);ctx.translate(-viewW/2-cam.x+(Math.random()-.5)*shake,-viewH/2-cam.y+(Math.random()-.5)*shake);ctx.drawImage(trackCanvas,0,0);for(let m of skids){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);ctx.globalAlpha=Math.min(.3,m.life*.3);ctx.fillStyle='#06090b';ctx.fillRect(-15,-2,30,4);ctx.restore();}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max)*.5;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+(1-p.life/p.max)),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(mode==='time'&&ghostBest.length){let p=ghostBest[Math.min(ghostIndex,ghostBest.length-1)];if(p){ctx.globalAlpha=.22;drawCarShape(ctx,p.x,p.y,p.a,'#9beeff',carType,.95);ctx.globalAlpha=1;}}for(let bot of ai)drawCarShape(ctx,bot.x,bot.y,bot.a,bot.color,1,.95);drawCarShape(ctx,car.x,car.y,car.a,PAINTS[paintIndex],carType,1);ctx.restore();if(!running&&screen==='home'){} }
function renderLoop(now){let delta=Math.min(.05,(now-last)/1000);last=now;if(running&&!paused){acc+=delta;while(acc>=DT){step();acc-=DT;}}draw();requestAnimationFrame(renderLoop);}
function activate(){makeTrack();initCar();running=true;paused=false;screen='game';$('overlay').classList.add('hidden');$('hud').style.display='flex';$('touch').style.display='flex';$('pause').style.display='block';startAudio();if(audio&&audio.state==='suspended')audio.resume();}
function pauseGame(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ Weiter':'Ⅱ Pause';if(paused){$('overlay').classList.remove('hidden');$('menu').innerHTML='<div class="eyebrow">PAUSE</div><h2>Kurze Verschnaufpause</h2><p class="intro">Dein Rennen ist angehalten.</p><div class="row"><button class="secondary" id="resume">Weiterfahren</button><button class="secondary" id="quit">Zum Menü</button></div>'; $('resume').onclick=()=>{$('overlay').classList.add('hidden');paused=false;$('pause').textContent='Ⅱ Pause';};$('quit').onclick=()=>{running=false;paused=false;$('hud').style.display='none';$('touch').style.display='none';$('pause').style.display='none';showMenu('home');};}else{$('overlay').classList.add('hidden');}}

function showMenu(which){screen=which;$('overlay').classList.remove('hidden');$('hud').style.display='none';$('touch').style.display='none';$('pause').style.display='none';let m=$('menu');if(which==='results'){m.innerHTML='<div class="eyebrow">ZIEL ERREICHT</div><div class="brand">RUNDE <span>GESCHAFFT</span></div><p class="intro">Drift-Punkte: <b>'+Math.floor(score).toLocaleString('de-CH')+'</b> · Belohnung: <b>+'+coinsEarned+' ⭐</b><br>Fahrzeit: '+fmt(elapsed*1000)+' · Medaille: '+(medals[trackIndex]||1)+'/3</p><div class="row"><button class="primary" id="again">Nochmal fahren</button><button class="secondary" id="menuhome">Zur Streckenwahl</button></div>'; $('again').onclick=activate;$('menuhome').onclick=()=>showMenu('home');return;}

function garageHTML(){return '<div class="eyebrow">DEINE WERKSTATT</div><div class="brand">GARAGE <span>01</span></div><div class="garagegrid"><div><div class="carview"><canvas id="garageCar" width="600" height="260"></canvas></div><div class="carchoices">'+CARS.map((c,i)=>'<button class="carchoice '+(carType===i?'active':'')+'" data-car="'+i+'">'+c.name+'</button>').join('')+'</div><div class="pill">⭐ '+stars+' Münzen</div></div><div><h3>Fahrzeugwerte</h3>'+[['Tempo',Math.min(98,45+engineLevel*10+CARS[carType].power*10)],['Grip',Math.min(98,40+gripLevel*10+CARS[carType].grip*15)],['Kontrolle',Math.min(98,48+suspension*9+driftKit*7+CARS[carType].turn*12)],['Bremsen',Math.min(98,35+brakes*15)]].map(([n,v])=>'<label>'+n+'</label><div class="bar"><i style="width:'+v+'%"></i></div>').join('')+'<h3>Leistungsteile</h3><div class="shop">'+UPGRADE.map(u=>{let level=getUpgradeLevel(u.key)||0,cost=u.cost[level]||0;return '<button class="upgrade" data-upgrade="'+u.key+'" '+(level>=MAX||stars<cost?'disabled':'')+'>'+u.icon+' '+u.label+' · '+level+'/'+MAX+'<small>'+(level>=MAX?'MAXIMAL':u.desc+' · '+cost+' ⭐')+'</small></button>';}).join('')+'</div><h3>Optik</h3><small>Lack · 12 Farben</small><div class="swatches">'+PAINTS.map((c,i)=>'<button class="swatch" data-paint="'+i+'" style="background:'+c+'" aria-label="Lack '+(i+1)+'"></button>').join('')+'</div><div class="shop"><button class="upgrade" id="stripe">Streifen: '+(stripe?'An':'Aus')+'</button><button class="upgrade" id="neon">Unterboden: '+(neon?'An':'Aus')+'</button><button class="upgrade" id="smoke">Rauchfarbe wechseln</button><button class="upgrade" id="spoiler">Spoiler: '+spoiler+'</button></div></div></div><div class="row"><button class="secondary" id="backMenu">← Zurück</button><button class="primary" id="testDrive">Probefahrt starten →</button></div><p class="note">Upgrades verändern Fahrwerte und Fahrzeugdetails. Dein Fortschritt bleibt gespeichert.</p>';}
function wireGarage(){let gc=$('garageCar'),g=gc.getContext('2d');let angle=0;function preview(){g.clearRect(0,0,600,260);g.save();g.translate(300,130);g.rotate(Math.sin(angle)*.06);drawCarShape(g,0,0,-.18,PAINTS[paintIndex],carType,3.4);g.restore();angle+=.025;if(screen==='garage')requestAnimationFrame(preview);}preview();$('menu').querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{carType=Number(b.dataset.car);saveAll();showMenu('garage');});$('menu').querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{let u=UPGRADE.find(x=>x.key===b.dataset.upgrade),level=getUpgradeLevel(u.key),cost=u.cost[level];if(level<MAX&&stars>=cost){stars-=cost;setUpgradeLevel(u.key,level+1);saveAll();showMenu('garage');}});$('menu').querySelectorAll('[data-paint]').forEach(b=>b.onclick=()=>{paintIndex=Number(b.dataset.paint);saveAll();showMenu('garage');});$('stripe').onclick=()=>{stripe=1-stripe;saveAll();showMenu('garage');};$('neon').onclick=()=>{neon=1-neon;saveAll();showMenu('garage');};$('smoke').onclick=()=>{smokeColor=(smokeColor+1)%PAINTS.length;saveAll();showMenu('garage');};$('spoiler').onclick=()=>{spoiler=(spoiler+1)%4;saveAll();showMenu('garage');};$('backMenu').onclick=()=>showMenu('home');$('testDrive').onclick=activate;}
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'hand',ShiftLeft:'nitro',ShiftRight:'nitro'};addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault();}if(e.code==='Escape'||e.code==='KeyP')pauseGame();if(e.code==='KeyR'&&running){initCar();} });addEventListener('keyup',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=false;e.preventDefault();}});document.querySelectorAll('.ctrl').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up));});
