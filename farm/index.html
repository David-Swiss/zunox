<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15251c"><title>Green Valley — Games.com</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b16;color:#f1f6ed;font:15px system-ui}.top{padding:16px max(18px,calc((100% - 1050px)/2));background:#1b3025;display:flex;justify-content:space-between}.top a{color:#b9f3bb;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:22px}.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.stat,.side{background:#1c3025;border:1px solid #385744;border-radius:12px;padding:12px 16px}.stat b{color:#b9ed91}.layout{display:grid;grid-template-columns:1fr 230px;gap:16px}.field{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#263d2b;padding:12px;border-radius:15px}.tile{aspect-ratio:1;background:#765333;border:2px solid #9b7548;border-radius:9px;display:grid;place-items:center;font-size:clamp(18px,4vw,34px);cursor:pointer;position:relative}.tile.ready{background:#b18a4b}.tile.wet:after{content:'💧';position:absolute;right:4px;bottom:2px;font-size:12px}.side h3{margin:0 0 10px}.side button,.action{width:100%;border:0;border-radius:9px;padding:11px;margin:4px 0;background:#b5e48c;color:#162518;font-weight:850;cursor:pointer}.side button.secondary{background:#395c44;color:#f3ffe9}.side p{color:#c4d4c5;font-size:13px;line-height:1.5}.hint{color:#c5d3c7;margin:14px 0}@media(max-width:700px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:5px}.side h3,.side p{grid-column:1/-1}.field{gap:5px;padding:7px}.top{padding:14px}}
</style></head><body><header class="top"><a href="../">← Alle Spiele</a><strong>GREEN VALLEY FARM</strong><span>FARM SIMULATOR</span></header><main class="wrap"><div class="stats"><div class="stat">Geld <b id="money">250</b> CHF</div><div class="stat">Tag <b id="day">1</b></div><div class="stat">Uhrzeit <b id="time">06:00</b></div><div class="stat">Ernte <b id="harvest">0</b></div></div><div class="layout"><section><div class="field" id="field"></div><p class="hint" id="hint">Wähle ein Feld und bestelle deinen Hof. Die Pflanzen brauchen Wasser und Zeit.</p></section><aside class="side"><h3>Werkzeuge & Hofladen</h3><button id="plow">🌱 Feld bestellen</button><button id="seed">🌾 Säen (10 CHF)</button><button id="water">💧 Giessen</button><button id="harvestBtn">🧺 Ernten & verkaufen</button><button class="secondary" id="land">🗺️ Feld kaufen (150 CHF)</button><button class="secondary" id="tractor">🚜 Traktor kaufen (400 CHF)</button><button class="secondary" id="save">💾 Spielstand sichern</button><p>Verkaufe reife Pflanzen für 45 CHF. Gießen beschleunigt das Wachstum. Dein Hof wird automatisch gespeichert.</p></aside></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state=JSON.parse(localStorage.getItem('greenValley')||'null')||{money:250,day:1,minutes:360,harvest:0,tractor:false,plots:Array.from({length:10},()=>({stage:0,water:0,progress:0}))},selected=0,tool='plow';function save(){localStorage.setItem('greenValley',JSON.stringify(state));}function render(){ $('money').textContent=state.money;$('day').textContent=state.day;$('time').textContent=String(Math.floor(state.minutes/60)%24).padStart(2,'0')+':'+String(state.minutes%60).padStart(2,'0');$('harvest').textContent=state.harvest;const f=$('field');f.innerHTML='';state.plots.forEach((p,i)=>{let b=document.createElement('button');b.className='tile'+(p.stage===3?' ready':'')+(p.water?' wet':'');b.textContent=['🟫','🟤','🌱','🌿','🌽'][p.stage];b.setAttribute('aria-label','Feld '+(i+1));b.onclick=()=>{selected=i;act();};if(selected===i)b.style.outline='3px solid #d9f6a0';f.append(b);});}function note(s){$('hint').textContent=s;save();render();}function act(){let p=state.plots[selected];if(tool==='plow'){if(p.stage===0){p.stage=1;note('Feld '+(selected+1)+' ist vorbereitet. Jetzt kannst du säen.');}else note('Dieses Feld ist bereits bestellt.');}else if(tool==='seed'){if(p.stage!==1)return note('Bestelle zuerst ein leeres Feld.');if(state.money<10)return note('Nicht genug Geld für Saatgut.');state.money-=10;p.stage=2;p.progress=0;note('Gesät! Gieße das Feld und warte auf das Wachstum.');}else if(tool==='water'){if(p.stage!==2&&p.stage!==3)return note('Hier wächst gerade nichts.');p.water=1;p.progress+=.35;note('Bewässert! Das Wachstum wird beschleunigt.');}else if(tool==='harvest'){if(p.stage!==3)return note('Die Pflanze ist noch nicht reif.');p.stage=1;p.progress=0;p.water=0;state.money+=45;state.harvest++;note('Ernte verkauft: +45 CHF.');}}$('plow').onclick=()=>tool='plow';$('seed').onclick=()=>tool='seed';$('water').onclick=()=>tool='water';$('harvestBtn').onclick=()=>tool='harvest';$('land').onclick=()=>{if(state.money<150)return note('Du brauchst 150 CHF.');state.money-=150;state.plots.push({stage:0,water:0,progress:0});note('Neues Feld gekauft!');};$('tractor').onclick=()=>{if(state.tractor)return note('Du besitzt bereits einen Traktor.');if(state.money<400)return note('Du brauchst 400 CHF.');state.money-=400;state.tractor=true;note('Traktor gekauft! Wachstum ist jetzt schneller.');};$('save').onclick=()=>note('Spielstand gespeichert.');setInterval(()=>{state.minutes+=5;if(state.minutes>=1440){state.minutes-=1440;state.day++;}state.plots.forEach(p=>{if(p.stage===2){p.progress+=p.water?.09:.025;p.water=0;if(p.progress>=(state.tractor?1.5:2.2))p.stage=3;}});save();render();},1000);render();})();
</script></body></html>
