<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b1020">
<title>GAMEZONE — Play</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1b2740;--text:#eef3ff;--muted:#9aa9c7;--accent:#58e6ff;--accent2:#8b6cff;--line:#263552}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 15% 0,#192848 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}
.top{position:sticky;top:0;z-index:5;background:#0b1020e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:16px}
.logo{font-weight:950;letter-spacing:1px;font-size:22px;background:linear-gradient(90deg,var(--accent),#a78bfa);-webkit-background-clip:text;color:transparent}
.navlinks{display:flex;gap:8px;flex:1}.navlinks button,.pill{padding:9px 13px;background:transparent;border:1px solid transparent;border-radius:999px;color:var(--muted)}.navlinks button:hover,.navlinks button.active{color:white;background:var(--panel2);border-color:var(--line)}
.search{width:min(240px,35vw);background:#111a2c;border:1px solid var(--line);border-radius:12px;color:white;padding:10px 12px;outline:none}.search:focus{border-color:var(--accent)}
main{max-width:1200px;margin:auto;padding:24px 18px 60px}
.hero{border:1px solid #314567;border-radius:24px;overflow:hidden;padding:clamp(20px,5vw,44px);background:linear-gradient(120deg,#162847,#171b37 65%,#2b1d4b);position:relative}
.hero:after{content:"";position:absolute;right:-40px;top:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#58e6ff44,transparent 68%);pointer-events:none}
.kicker{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:2px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:10px 0}.hero p{color:#b8c5df;max-width:580px;margin:0 0 20px}.primary{background:linear-gradient(90deg,#40d9f6,#8b75ff);color:#06111e;font-weight:900;padding:12px 18px;border-radius:12px;box-shadow:0 8px 25px #43d8ff22}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{padding:7px 11px;background:#0d1829aa;border:1px solid #314567;border-radius:999px;font-size:12px;color:#c8d5ed}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;gap:10px}.sectionhead h2{margin:0;font-size:20px}.sectionhead span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:12px 0 18px}.filter{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}.filter.selected{background:#1e3a55;color:var(--accent);border-color:#37718e}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.gamecard{background:linear-gradient(150deg,var(--panel),#11182a);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.18s;min-width:0}.gamecard:hover{transform:translateY(-3px);border-color:#466b9a;box-shadow:0 12px 30px #0003}.thumb{height:120px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#10162655,transparent)}.cardbody{padding:13px}.cardbody h3{margin:0 0 6px;font-size:15px}.cardbody p{margin:0;color:var(--muted);font-size:12px;min-height:32px}.cardbottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.tag{font-size:11px;color:#b9c9e5;background:#202d45;padding:5px 8px;border-radius:999px}.playbtn{background:#263a57;padding:8px 11px;border-radius:9px;font-weight:750;font-size:12px}.playbtn:hover{background:#36557d}
.overlay{display:none;position:fixed;inset:0;z-index:20;background:#050812e8;backdrop-filter:blur(8px);padding:12px;overflow:auto}.overlay.open{display:flex;align-items:center;justify-content:center}.modal{width:min(940px,100%);background:#111a2b;border:1px solid #2b3e5d;border-radius:20px;overflow:hidden;box-shadow:0 30px 100px #0009}.modalhead{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.modalhead h2{font-size:17px;margin:0;flex:1}.iconbtn{background:#25334b;border-radius:9px;padding:9px 12px}.gamearea{padding:14px}.gameinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:13px}.canvaswrap{background:#070d18;border:1px solid #2a3b58;border-radius:14px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:250px}.canvaswrap canvas{display:block;max-width:100%;height:auto;touch-action:none}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.controls button{background:#243651;border:1px solid #344d70;border-radius:10px;padding:10px 14px}.controls button:hover{background:#36527a}.hint{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}.notice{display:none;padding:10px 12px;border-radius:10px;background:#203451;color:#d9e8ff;text-align:center;margin-top:10px}.notice.show{display:block}
.mobilepad{display:none;gap:8px;justify-content:center;margin-top:10px}.mobilepad button{width:54px;height:46px;border-radius:12px;background:#253957;font-size:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.navlinks{display:none}}
@media(max-width:620px){main{padding:14px 12px 40px}.nav{padding:11px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:95px;font-size:38px}.cardbody{padding:10px}.cardbody p{min-height:38px}.hero{border-radius:18px}.search{width:42vw}.modal{border-radius:16px}.overlay{padding:6px}.mobilepad{display:flex}}
@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.logo{font-size:18px}}
</style>
<style>
/* GAMEZONE 2.0 polish */
.hero{box-shadow:0 18px 55px #03071370}.gamecard{display:flex;flex-direction:column}.cardbody{display:flex;flex-direction:column;flex:1}.cardbottom{margin-top:auto;padding-top:12px}.thumb{overflow:hidden}.thumb:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid #ffffff22;transform:translate(55px,20px)}.gamecard:hover .thumb{filter:saturate(1.3)}.filter{transition:.15s}.filter:hover{border-color:#69dff3;color:white}.gamearea{max-width:100%;}.canvaswrap canvas{border-radius:10px}.search{box-shadow:inset 0 1px 2px #0003}
</style><style>
/* GAMEZONE cover art + game visual upgrade */
.thumb{height:150px;background:radial-gradient(circle at 72% 20%,#ffffff38,transparent 25%),linear-gradient(145deg,var(--c1),var(--c2));isolation:isolate}
.thumb:before{width:170px;height:170px;border:1px solid #ffffff20;right:-25px;top:-45px;transform:none;box-shadow:0 0 0 18px #ffffff08,0 0 0 36px #ffffff06}
.thumb:after{background:linear-gradient(0deg,#070b18c9 0%,transparent 65%);z-index:0}
.thumbicon{position:relative;z-index:1;font-size:66px;filter:drop-shadow(0 10px 10px #0008);transform:translateY(-3px);transition:transform .25s,filter .25s}
.thumbshine{position:absolute;inset:0;z-index:0;opacity:.55;background:linear-gradient(120deg,transparent 25%,#ffffff18 48%,transparent 65%);transform:translateX(-80%);transition:transform .55s}
.thumbcaption{position:absolute;z-index:2;bottom:9px;left:11px;font-size:9px;letter-spacing:1.5px;font-weight:900;color:#ffffffc9}
.gamecard:hover .thumbshine{transform:translateX(80%)}
.gamecard:hover .thumbicon{transform:translateY(-7px) scale(1.12);filter:drop-shadow(0 12px 14px #0009)}
/* Different artwork atmospheres */
.thumb[data-game="racer"],.thumb[data-game="drift"]{background:radial-gradient(ellipse at 50% 85%,#ffffff24,transparent 40%),linear-gradient(145deg,#081c36,#00a5c9)}
.thumb[data-game="racer"]:before,.thumb[data-game="drift"]:before{border-radius:24px;transform:rotate(35deg);right:10px;top:12px;width:95px;height:180px}
.thumb[data-game="shooter"],.thumb[data-game="dodge"]{background:radial-gradient(circle at 50% 50%,#7865ff65,transparent 45%),linear-gradient(145deg,#080b27,#31217a)}
.thumb[data-game="snake"],.thumb[data-game="tower"],.thumb[data-game="platform"]{background:radial-gradient(circle at 30% 80%,#3cff9a35,transparent 40%),linear-gradient(145deg,#082d27,#126d4e)}
.thumb[data-game="breakout"],.thumb[data-game="bubble"],.thumb[data-game="blocks"]{background:radial-gradient(circle at 70% 20%,#ff89e044,transparent 40%),linear-gradient(145deg,#27133e,#9c367b)}
.thumb[data-game="2048"],.thumb[data-game="mines"],.thumb[data-game="solitaire"]{background:radial-gradient(circle at 50% 45%,#ffd18a44,transparent 40%),linear-gradient(145deg,#49321e,#b78242)}
.thumb[data-game="memory"],.thumb[data-game="memory2"],.thumb[data-game="quiz"]{background:radial-gradient(circle at 70% 20%,#8bb6ff44,transparent 38%),linear-gradient(145deg,#15274c,#586fb4)}
.thumb[data-game="penalty"],.thumb[data-game="basket"]{background:radial-gradient(circle at 50% 80%,#ffffff20,transparent 42%),linear-gradient(145deg,#10472e,#34a86a)}
.thumb[data-game="reaction"],.thumb[data-game="aim"],.thumb[data-game="clicker"],.thumb[data-game="typing"]{background:radial-gradient(circle at 50% 50%,#ffffff20,transparent 45%),linear-gradient(145deg,#2a164b,#7d4cc8)}
.thumb[data-game="runner"],.thumb[data-game="flappy"],.thumb[data-game="tetris"]{background:radial-gradient(circle at 70% 20%,#7ce7ff44,transparent 40%),linear-gradient(145deg,#0c2948,#267fae)}
.thumb[data-game="ttt"],.thumb[data-game="connect"],.thumb[data-game="maze"],.thumb[data-game="whack"]{background:radial-gradient(circle at 50% 50%,#ffffff18,transparent 50%),linear-gradient(145deg,#1d2b45,#526fa5)}
/* Canvas game screens */
.canvaswrap{background:radial-gradient(ellipse at top,#1c2b47,#050a12 70%);border-color:#3b5274;box-shadow:inset 0 0 35px #0007,0 10px 35px #0004}
.canvaswrap canvas{border:1px solid #ffffff0b;box-shadow:0 0 25px #58e6ff12;image-rendering:auto}
.gamecard{border-color:#2b3d5b;background:linear-gradient(160deg,#18243a,#0d1424)}
.gamecard:hover{border-color:#62d8f3;box-shadow:0 14px 35px #0005,0 0 0 1px #62d8f322}
.cardbody h3{letter-spacing:.15px}
.playbtn{background:linear-gradient(135deg,#2a4567,#355780);border:1px solid #456487}
@media(max-width:620px){.thumb{height:110px}.thumbicon{font-size:52px}.thumbcaption{font-size:8px;bottom:7px;left:8px}}
</style><style>
/* Clearer game descriptions and richer play feedback */
.cardbody p{font-size:12.5px;line-height:1.5;min-height:48px;color:#b7c6df}
.gameinfo span{max-width:75%;line-height:1.4}
.notice{font-weight:750;border:1px solid #38577d;box-shadow:0 4px 16px #0002}
.controls button,.mobilepad button{transition:transform .12s,filter .12s}
.controls button:active,.mobilepad button:active{transform:scale(.96);filter:brightness(1.2)}
.canvaswrap{touch-action:pan-y}
@media(max-width:620px){.cardbody p{min-height:64px;font-size:12px}.gameinfo span{max-width:100%}}
</style><style>
/* Clean, compact game overlay */
.overlay{padding:clamp(8px,2vw,22px);background:rgba(4,7,14,.78);backdrop-filter:blur(14px);align-items:flex-start!important}
.overlay.open{overflow-y:auto}
.modal{width:min(1000px,100%);margin:auto;border-radius:22px;background:linear-gradient(160deg,#121c2e,#0b1220);border:1px solid #2c405f;box-shadow:0 24px 90px #0009}
.modalhead{padding:14px 18px;background:#111a2a;position:sticky;top:0;z-index:2;gap:10px}
.modalhead h2{font-size:18px;font-weight:850;letter-spacing:.1px}
.iconbtn{font-size:13px;font-weight:700;padding:9px 12px;border:1px solid #304461;background:#1c2a40;transition:.15s}
.iconbtn:hover{background:#2b4261;transform:translateY(-1px)}
.gamearea{padding:clamp(10px,2vw,18px)}
.gameinfo{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#0c1524;border:1px solid #243650}
.gameinfo #score{color:#e8f2ff;background:#1a2b43;padding:7px 10px;border-radius:9px;font-size:13px}
.canvaswrap{min-height:0;padding:8px;background:linear-gradient(145deg,#0b1423,#060b13);border-radius:16px;border:1px solid #2c405b}

.controls{margin-top:12px;gap:8px}
.controls button{border-radius:11px;padding:10px 13px;font-weight:750;font-size:13px;border:1px solid #344c6c;background:#1c2d45;box-shadow:0 2px 0 #0a101a;transition:.14s}
.controls button:hover:not(:disabled){background:#2b4565;border-color:#5277a1;transform:translateY(-1px)}
.controls button:disabled{cursor:not-allowed;opacity:.42}
.hint{margin:10px 0 2px;font-size:12px;line-height:1.5}
.notice{margin-top:10px;border:1px solid #39577c;background:#182b45;border-radius:12px}
.mobilepad button{border:1px solid #385270;box-shadow:0 3px 0 #111b2b}
.overlay[data-game="cookie"] .modal{max-width:860px}
.overlay[data-game="cookie"] .gamearea{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:12px;align-items:start}

.overlay[data-game="cookie"] .canvaswrap canvas{max-height:none}
.overlay[data-game="cookie"] .controls{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr;justify-content:stretch;margin:0;max-height:410px;overflow-y:auto;padding-right:3px}
.overlay[data-game="cookie"] .controls button{width:100%;text-align:left;min-width:0!important;padding:12px 13px;line-height:1.35;border-radius:12px;background:linear-gradient(135deg,#342b21,#4a3828);border-color:#6a5038;color:#ffe5b4}
.overlay[data-game="cookie"] .controls button:hover:not(:disabled){background:linear-gradient(135deg,#493a2a,#65472e);border-color:#ad8454}
.overlay[data-game="cookie"] .controls button:disabled{background:#182338;border-color:#283b56;color:#91a3bf}
.overlay[data-game="cookie"] .hint{grid-column:1/-1}
@media(max-width:680px){
 .overlay{padding:5px;align-items:flex-start!important}
 .modal{border-radius:15px}
 .modalhead{padding:10px 11px;gap:6px}
 .modalhead h2{font-size:15px}
 .iconbtn{font-size:11px;padding:8px}
 .gamearea{padding:9px}
 .canvaswrap{padding:3px;border-radius:12px}
 .canvaswrap canvas{max-height:48vh}
 .gameinfo{padding:8px 9px;font-size:12px}

 .overlay[data-game="cookie"] .gamearea{grid-template-columns:1fr;gap:9px}

 .overlay[data-game="cookie"] .canvaswrap canvas{max-height:42vh}
 .overlay[data-game="cookie"] .controls{grid-column:1;grid-row:3;grid-template-columns:1fr 1fr;max-height:270px;gap:7px}

}
</style>
<style>

}

ssen mit schnellen Fragen. Wähle die richtige Antwort und sammle Punkte für jede richtige Lösung.",colors:["#42305f","#a579e4"]},{id:"typing",name:"Type Sprint",cat:"Skill",icon:"⌨️",desc:"Tippe die angezeigten Wörter so schnell und genau wie möglich. Deine Geschwindigkeit und Fehlerquote entscheiden über den Score.",colors:["#213b50","#52a7a8"]},{id:"solitaire",name:"Card Sort",cat:"Puzzle",icon:"🃏",desc:"Sortiere die Karten nach Farben und Reihenfolge. Nutze freie Plätze mit Strategie und bringe alle Karten in die Zielstapel.",colors:["#204333","#4ca978"]},{id:"maze",name:"Maze Escape",cat:"Arcade",icon:"🧭",desc:"Finde den Ausgang im Labyrinth, ohne dich zu verlaufen. Plane deine Wege und erreiche das Ziel so schnell du kannst.",colors:["#2d354f","#738bc5"]});
const categories=["Alle","Racing","Arcade","Action","Puzzle","Skill","Sport","Strategy"];
const catalog=document.getElementById("catalog"),filters=document.getElementById("filters"),search=document.getElementById("search");
let category="Alle", active=null, gameState=null, loopId=0, lastTime=0, score=0, highs=JSON.parse(localStorage.getItem("gz-highs")||"{}");
function render(){
 const q=search.value.toLowerCase().trim();const shown=games.filter(g=>(category==="Alle"||g.cat===category)&&(g.name.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q)));
 catalog.innerHTML=shown.map(g=>`<article class="gamecard"><div class="thumb" data-game="${g.id}" style="--c1:${g.colors[0]};--c2:${g.colors[1]}"><span class="thumbicon">${g.icon}</span><span class="thumbshine"></span><span class="thumbcaption">${g.cat.toUpperCase()} · PLAY NOW</span></div><div class="cardbody"><h3>${g.name}</h3><p>${g.desc}</p><div class="cardbottom"><span class="tag">${g.cat}${highs[g.id]?" · 🏆 "+highs[g.id]:""}</span><button class="playbtn" data-play="${g.id}">Spielen ▶</button></div></div></article>`).join("");
 document.getElementById("count").textContent=`${shown.length} Spiele`;
}
filters.innerHTML=categories.map(c=>`<button class="filter ${c==="Alle"?"selected":""}" data-cat="${c}">${c}</button>`).join("");
filters.addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;category=b.dataset.cat;filters.querySelectorAll(".filter").forEach(x=>x.classList.toggle("selected",x===b));render()});
search.addEventListener("input",render);catalog.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(b)openGame(b.dataset.play)});
document.getElementById("featured").onclick=()=>openGame("racer");
const overlay=document.getElementById("overlay"),wrap=document.getElementById("canvaswrap"),controls=document.getElementById("controls"),pad=document.getElementById("mobilepad"),notice=document.getElementById("notice");
document.getElementById("close").onclick=closeGame;document.getElementById("restart").onclick=()=>active&&openGame(active.id);document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeGame()});
function cleanupGame(){
 if(gameState){gameState.cleanup?.();(gameState.timers||[]).forEach(clearTimeout);gameState.timers=[];gameState.running=false;}
 stopLoop();
}
function closeGame(){overlay.classList.remove("open");cleanupGame();active=null;gameState=null;wrap.innerHTML="";controls.innerHTML="";pad.innerHTML=""}
function stopLoop(){if(loopId){cancelAnimationFrame(loopId);loopId=0}}
function setScore(n){score=Math.max(0,Math.floor(n));document.getElementById("score").textContent="Punkte: "+score+(active&&highs[active.id]?" · Best: "+highs[active.id]:"")}
function showNotice(t){notice.textContent=t;notice.classList.add("show")}
function hideNotice(){notice.classList.remove("show")}
function openGame(id){
 cleanupGame();active=games.find(g=>g.id===id);if(!active)return;
 overlay.classList.add("open");overlay.dataset.game=id;document.getElementById("gameTitle").textContent=active.icon+" "+active.name;
 document.getElementById("gameDesc").textContent=active.desc;document.getElementById("hint").textContent="";wrap.innerHTML="";controls.innerHTML="";pad.innerHTML="";hideNotice();setScore(0);
 const c=document.createElement("canvas");c.width=720;c.height=440;c.style.width="min(100%, 720px)";c.style.height="auto";wrap.append(c);
 const ctx=c.getContext("2d");ctx.imageSmoothingEnabled=false;
 gameState={canvas:c,ctx,keys:{},running:true,over:false,score:0,timers:[]};
 const state=gameState; let gameDifficulty=1; const later=(fn,ms)=>{const timer=setTimeout(()=>{state.timers=state.timers.filter(t=>t!==timer);if(active&&active.id===id&&gameState===state)fn()},ms);state.timers.push(timer);return timer}; const hint=(t)=>document.getElementById("hint").textContent=t;
 const button=(label,fn)=>{let b=document.createElement("button");b.textContent=label;b.onclick=fn;controls.append(b);return b};
 const mobile=(label,key)=>{let b=document.createElement("button");b.textContent=label;b.onpointerdown=e=>{e.preventDefault();state.keys[key]=true};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>state.keys[key]=false;pad.append(b)};
 const resetBase=()=>{state.over=false;state.running=true;hideNotice();setScore(0)};
 const end=(message="Spiel vorbei! Neustart für eine neue Runde.")=>{if(state.over)return;state.over=true;state.running=false;highs[active.id]=Math.max(highs[active.id]||0,score);localStorage.setItem("gz-highs",JSON.stringify(highs));let prog=JSON.parse(localStorage.getItem("gz-progression")||"{}"),g=prog[active.id]||{xp:0,plays:0,best:0};let reward=20+Math.max(0,Math.floor(score/10));g.xp+=reward;g.plays++;g.best=Math.max(g.best,score);prog[active.id]=g;localStorage.setItem("gz-progression",JSON.stringify(prog));let lvl=1+Math.floor(g.xp/100);showNotice(message+" · +"+reward+" XP · Level "+lvl);document.getElementById("score").textContent="Punkte: "+score+" · Best: "+highs[active.id]+" · Level "+lvl;};
 const clear=(color="#07111e")=>{ctx.fillStyle=color;ctx.fillRect(0,0,c.width,c.height)};
 const text=(t,x,y,size=22,color="#fff",align="left")=>{ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y)};
 const rect=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
 const circle=(x,y,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()};
 const keysDown=e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();state.keys[e.key.toLowerCase()]=true};
 const keysUp=e=>state.keys[e.key.toLowerCase()]=false;
 window.addEventListener("keydown",keysDown);window.addEventListener("keyup",keysUp);
 state.cleanup=()=>{window.removeEventListener("keydown",keysDown);window.removeEventListener("keyup",keysUp)};
 button("⏸ Pause",()=>{state.running=!state.running;showNotice(state.running?"":"Pausiert — erneut Pause drücken zum Fortsetzen");if(state.running)hideNotice()});
 button("↻ Neu",()=>openGame(id));
 // Game implementations
 let update=()=>{},draw=()=>{},tick=0;
 const startLoop=()=>{lastTime=performance.now();const frame=now=>{if(!active||state!==gameState)return;const dt=Math.max(0,Math.min((now-lastTime)/16.67,2));lastTime=now;if(state.running&&!state.over){update(dt*gameDifficulty);tick++;}draw();loopId=requestAnimationFrame(frame)};loopId=requestAnimationFrame(frame)};
 const set=val=>setScore(Number.isFinite(val)?val:0);
 if(id==="snake"){
   hint("Steuerung: Pfeile / WASD · Touch-Pfeile unten");
   let cell=20,cols=36,rows=22,snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}],dir={x:1,y:0},next={x:1,y:0},food={x:20,y:10},acc=0;
   const place=()=>{do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))};place();
   mobile("⬆","arrowup");mobile("⬅","arrowleft");mobile("⬇","arrowdown");mobile("➡","arrowright");
   update=dt=>{if(state.keys.arrowup||state.keys.w)next={x:0,y:-1};if(state.keys.arrowdown||state.keys.s)next={x:0,y:1};if(state.keys.arrowleft||state.keys.a)next={x:-1,y:0};if(state.keys.arrowright||state.keys.d)next={x:1,y:0};if(next.x!==-dir.x||next.y!==-dir.y)dir=next;acc+=dt;if(acc<Math.max(4,8-score/100))return;acc=0;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some((p,i)=>i<snake.length-1&&p.x===head.x&&p.y===head.y)){end("Game Over · Punkte: "+score);return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){set(score+10);place()}else snake.pop()};
   draw=()=>{clear("#07151b");for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){rect(x*cell,y*cell,cell-1,cell-1,"#0b2027")}circle(food.x*cell+10,food.y*cell+10,8,"#ff617e");snake.forEach((p,i)=>rect(p.x*cell+1,p.y*cell+1,cell-3,cell-3,i?"#31b87b":"#8af5c2"))};
 }else if(id==="pong"){
   hint("W/S oder ↑/↓ · gegen Computer");
   let px=200,py=210,vy=3.3,bx=360,by=220,vx=4.5,bvy=2.5,ai=185,playerScore=0,aiScore=0;
   mobile("⬆","arrowup");mobile("⬇","arrowdown");
   update=dt=>{py+=(state.keys.arrowup||state.keys.w?-6:0)+(state.keys.arrowdown||state.keys.s?6:0);py=Math.max(0,Math.min(350,py));ai+=(by-(ai+45))*.075*dt;bx+=vx*dt;by+=bvy*dt;if(by<9||by>431)bvy=-bvy;if(bx<px+14&&bx>px&&by>py-8&&by<py+98&&vx<0){vx=Math.abs(vx)*1.04;bvy+=(by-(py+45))*.08}if(bx>688&&bx<700&&by>ai-8&&by<ai+98&&vx>0){vx=-Math.abs(vx)*1.03;bvy+=(by-(ai+45))*.07}if(bx<0){aiScore++;bx=360;by=220;vx=4.5;bvy=(Math.random()-.5)*5}if(bx>720){playerScore++;set(playerScore);bx=360;by=220;vx=-4.5;bvy=(Math.random()-.5)*5}if(playerScore>=5||aiScore>=5)end(playerScore>=5?"Du gewinnst!":"Computer gewinnt!")};
   draw=()=>{clear("#07111e");rect(355,0,4,440,"#29405c");rect(20,py,12,90,"#58e6ff");rect(688,ai,12,90,"#ff8b75");circle(bx,by,9,"#fff");text(playerScore,290,55,34);text(aiScore,420,55,34)};
 }else if(id==="breakout"){
   hint("← → / A D · Touch/Mouse bewegt Paddle");
   let paddle=300,ball={x:360,y:350,vx:3,vy:-4},bricks=[],lives=3;
   for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:35+col*65,y:55+r*26,w:58,h:18,on:true,color:["#ff6b8a","#ffb454","#5ce0c3","#7c9cff","#bd8cff"][r]});
   c.onpointermove=e=>{let rect=c.getBoundingClientRect();paddle=(e.clientX-rect.left)/rect.width*720-55};
   update=dt=>{paddle=Math.max(0,Math.min(610,paddle+((state.keys.arrowleft||state.keys.a)?-7:0)+((state.keys.arrowright||state.keys.d)?7:0)));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<8||ball.x>712)ball.vx=-ball.vx;if(ball.y<8)ball.vy=-ball.vy;if(ball.y>400&&ball.x>paddle&&ball.x<paddle+110&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(paddle+55))*.04}for(let b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.vy=-ball.vy;set(score+5);break}if(ball.y>445){lives--;ball={x:360,y:350,vx:3,vy:-4};if(lives<=0)end("Keine Leben mehr!")}if(bricks.every(b=>!b.on))end("Alle Blöcke zerstört — gewonnen!")};
   draw=()=>{clear();bricks.forEach(b=>b.on&&rect(b.x,b.y,b.w,b.h,b.color));rect(paddle,405,110,12,"#58e6ff");circle(ball.x,ball.y,8,"#fff");text("Leben: "+lives,18,28,16)};
 }else if(id==="runner"){
   hint("Space / ↑ oder tippen zum Springen");

   button("Reviews ansehen",()=>{let all=JSON.parse(localStorage.getItem("gz-chess-reviews")||"[]");showNotice("Archiv: "+all.length+" Partien · "+all.map((g,i)=>i+1+": "+g.moves.join(" ")).join("\\n"))});

   c.onclick=e=>{if(!chess||chess.isGameOver()||(mode==="multi"&&chess.turn()!==playerColor))return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*720,y=(e.clientY-r.top)/r.height*440,f=Math.floor((x-90)/67.5),rank=Math.floor((y-25)/48.75);if(f<0||f>7||rank<0||rank>7)return;let sq="abcdefgh"[f]+(8-rank),piece=chess.get(sq);if(selected===null){if(piece&&piece.color===chess.turn())selected=rank*8+f}else{let from="abcdefgh"[selected%8]+(8-Math.floor(selected/8));if(play(from,sq)){if(mode==="bot"&&chess.turn()==="b")later(botMove,550)}else selected=piece&&piece.color===chess.turn()?rank*8+f:null}drawBoard()};
   update=()=>{};draw=drawBoard;drawBoard();showNotice("Schach wird gestartet …");loadScript("https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js").then(()=>{if(typeof window.Chess!=="function")throw new Error("Chess.js fehlt");chess=new window.Chess();drawBoard();showNotice("Chess Arena bereit · Greg Moser ist absichtlich der Blunder-Bot.")}).catch(err=>{console.error("Chess Arena load:",err);showNotice("Schach-Bibliothek konnte nicht geladen werden. Prüfe Verbindung oder Content-Blocker.");button("↻ Schach neu laden",()=>{showNotice("Schach wird erneut geladen …");loadScript("https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js").then(()=>{chess=new window.Chess();drawBoard();showNotice("Chess Arena bereit!")}).catch(()=>showNotice("Laden fehlgeschlagen. Bitte Internetverbindung prüfen."))})});state.cleanup=()=>{window.removeEventListener("keydown",keysDown);window.removeEventListener("keyup",keysUp);if(peer)peer.destroy()};

   }else if(id==="clicker"){
