<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><meta name="description" content="Entdecke kostenlose Browsergames auf Games.com."><title>Games.com — Deine Gamezone</title>
<style>
:root{color-scheme:dark;--bg:#090f1d;--panel:#111c30;--line:#243650;--muted:#9aabc2;--cyan:#69e5e0;--lime:#b9f28a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -15%,#203b56 0,transparent 42%),var(--bg);color:#f2f6ff;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:100vh}.shell{width:min(1160px,calc(100% - 40px));margin:auto}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{font-size:22px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--cyan)}.nav small{color:var(--muted);letter-spacing:1.5px;font-size:10px;font-weight:800}.hero{padding:64px 0 35px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:2.5px}.hero h1{font-size:clamp(38px,6vw,68px);letter-spacing:-3px;line-height:1.02;margin:12px 0}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{color:#aab9cc;max-width:540px;font-size:16px}.hero-art{height:205px;border:1px solid #ffffff1a;border-radius:24px;background:linear-gradient(135deg,#142c42,#17203a 60%,#253c45);position:relative;overflow:hidden;display:grid;place-items:center}.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid #70e6de55;border-radius:50%;width:230px;height:230px;transform:rotate(-24deg) scaleX(1.6)}.hero-art:after{width:140px;height:140px;border-color:#b9f28a55;transform:rotate(32deg) scaleX(1.8)}.hero-art strong{font-size:62px;z-index:1;filter:drop-shadow(0 8px 18px #0008)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 28px}.search{flex:1;min-width:220px;background:#101a2c;border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:white;font:inherit;outline:none}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #69e5e022}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{background:#111c30;border:1px solid var(--line);color:#b7c6d9;padding:10px 13px;border-radius:10px;font-weight:750;cursor:pointer}.filter[aria-pressed=true]{background:#18383d;border-color:#4ecac3;color:#c7fffa}.section-head{display:flex;justify-content:space-between;align-items:end;margin:20px 0 14px}.section-head h2{margin:0;font-size:24px;letter-spacing:-.7px}.section-head span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:60px}.card{background:linear-gradient(155deg,#15233a,#101a2b);border:1px solid #2a3c55;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:250px;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-4px);border-color:#62d8d0;box-shadow:0 14px 35px #0004}.cover{height:125px;display:grid;place-items:center;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff28;border-radius:50%;box-shadow:0 0 0 22px #ffffff08,0 0 0 48px #ffffff06}.cover span{font-size:50px;filter:drop-shadow(0 8px 12px #0008);z-index:1}.city{background:linear-gradient(130deg,#0c5968,#172c54 60%,#8a4770)}.shooter{background:linear-gradient(130deg,#411b43,#a33454 60%,#ef9a53)}.farm{background:linear-gradient(130deg,#245c3e,#78a74d 60%,#d6ac5e)}.chess{background:linear-gradient(130deg,#283c35,#6a8d60 60%,#b0a77a)}.card-body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.card h3{font-size:19px;margin:8px 0 4px}.card p{margin:0;color:#a9b7c9;font-size:13px;line-height:1.55;flex:1}.play{margin-top:15px;display:flex;justify-content:space-between;align-items:center;color:var(--lime);font-weight:900;text-decoration:none}.play:hover{color:white}.empty{grid-column:1/-1;border:1px dashed #41536d;border-radius:14px;padding:35px;text-align:center;color:var(--muted)}footer{border-top:1px solid #ffffff12;padding:22px 0 35px;color:#73849b;font-size:12px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:44px}.hero-art{height:135px}.hero-art strong{font-size:48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.shell{width:calc(100% - 26px)}.nav{height:62px}.nav small{font-size:8px}.hero{padding:34px 0 18px;gap:16px}.hero h1{font-size:43px;letter-spacing:-2px}.hero p{font-size:14px}.hero-art{display:none}.controls{display:grid}.filters{display:grid;grid-template-columns:repeat(2,1fr)}.filter{padding:9px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:0}.cover{height:110px}.section-head h2{font-size:21px}}
</style></head><body><header class="shell nav"><div class="brand">GAMES<span>.COM</span></div><small>DEINE GAMEZONE · KOSTENLOS SPIELEN</small></header><main class="shell"><section class="hero"><div><div class="eyebrow">SPIELEN. ENTDECKEN. WIEDERHOLEN.</div><h1>Dein nächstes<br><em>Lieblingsgame.</em></h1><p>Entdecke handverlesene Browsergames. Direkt starten, ohne Anmeldung und ohne Download.</p></div><div class="hero-art" aria-hidden="true"><strong>🎮</strong></div></section><section aria-label="Spiele suchen und filtern"><div class="controls"><input class="search" id="search" type="search" placeholder="Spiel suchen …" aria-label="Spiele suchen"><div class="filters" id="filters"></div></div></section><div class="section-head"><h2>Alle Spiele</h2><span id="count"></span></div><section class="grid" id="games" aria-live="polite"></section></main><footer><div class="shell">GAMES.COM · Kostenlose Spiele direkt im Browser</div></footer>
<script>
'use strict';
// Ein neues Spiel benötigt nur einen Ordner mit index.html und einen Eintrag in GAMES.
const GAMES=[
 {title:'Afterglow City',description:'Erkunde die offene Stadt, fahre durch den Verkehr und entkomme der Polizei.',category:'Simulation',path:'afterglow-city/',icon:'🏎️',style:'city'},
 {title:'Neon Assault',description:'Überlebe Gegnerwellen, verwalte deine Munition und knacke deinen Highscore.',category:'Action',path:'shooter/',icon:'🎯',style:'shooter'},
 {title:'Green Valley Farm',description:'Bestelle Felder, gieße deine Pflanzen und baue deinen eigenen Hof auf.',category:'Simulation',path:'farm/',icon:'🚜',style:'farm'},
 {title:'Schach',description:'Spiele eine Partie Schach direkt im Browser.',category:'Strategie',path:'chess/',icon:'♟️',style:'chess'}
];
const categories=['Alle',...new Set(GAMES.map(g=>g.category))];let active='Alle';
const filters=document.querySelector('#filters'),grid=document.querySelector('#games'),search=document.querySelector('#search');
categories.forEach(c=>{const b=document.createElement('button');b.className='filter';b.textContent=c;b.setAttribute('aria-pressed',c===active?'true':'false');b.onclick=()=>{active=c;filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.textContent===active)));render();};filters.append(b);});
function render(){const q=search.value.trim().toLocaleLowerCase('de');const list=GAMES.filter(g=>(active==='Alle'||g.category===active)&&(g.title+' '+g.description+' '+g.category).toLocaleLowerCase('de').includes(q));grid.innerHTML='';document.querySelector('#count').textContent=list.length+' Spiele';if(!list.length){grid.innerHTML='<div class="empty">Keine Spiele gefunden. Probiere einen anderen Suchbegriff.</div>';return;}list.forEach(g=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div class="cover '+g.style+'"><span>'+g.icon+'</span></div><div class="card-body"><div class="meta"><span>'+g.category+'</span><span>Browsergame</span></div><h3></h3><p></p><a class="play" href="'+g.path+'"><span>Jetzt spielen</span><span>↗</span></a></div>';a.querySelector('h3').textContent=g.title;a.querySelector('p').textContent=g.description;grid.append(a);});}
search.addEventListener('input',render);render();
</script></body></html>
