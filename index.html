<style>

ransform:translateY(-2px)}.cover.city:after{border-radius:35% 8% 30% 8%;transform:rotate(25deg) scale(1.25)}.cover.shooter:after{border-radius:50%;transform:rotate(-20deg) scale(.9)}.cover.farm:after{border-radius:45% 45% 15% 15%;transform:rotate(0) scale(1.05)}.void{background:linear-gradient(130deg,#081326,#17385b 55%,#6a286d)}.cover:before,.cover:after{display:none}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.city{background:linear-gradient(130deg,#0c5968,#172c54 60%,#8a4770)}.shooter{background:linear-gradient(130deg,#411b43,#a33454 60%,#ef9a53)}.farm{background:linear-gradient(130deg,#245c3e,#78a74d 60%,#d6ac5e)}.drift{background:linear-gradient(130deg,#123d49,#187f82 55%,#b3e85b)}.card-body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.meta-left{display:flex;align-items:center;gap:8px}.tag{color:#c9ff87;background:#253b28;border:1px solid #5a8c45;border-radius:20px;padding:3px 7px;font-size:9px}.control{color:#a9bfd6;background:#17263a;border:1px solid #30445d;border-radius:20px;padding:3px 7px;font-size:9px;letter-spacing:.3px;white-space:nowrap}.card h3{font-size:19px;margin:8px 0 4px}.card p{margin:0;color:#a9b7c9;font-size:13px;line-height:1.55;flex:1}.play{margin-top:15px;display:flex;justify-content:space-between;align-items:center;color:var(--lime);font-weight:900;text-decoration:none}.play:hover{color:white}.empty{grid-column:1/-1;border:1px dashed #41536d;border-radius:14px;padding:35px;text-align:center;color:var(--muted)}footer{border-top:1px solid #ffffff12;padding:22px 0 35px;color:#73849b;font-size:12px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:44px}.hero-art{height:135px}.hero-art strong{font-size:48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.shell{width:calc(100% <script>
'use strict';
// Ein neues Spiel benötigt nur einen Ordner mit index.html und einen Eintrag in GAMES.
const GAMES=[
 {title:'ZUNOX Chess',control:'Maus / Touch',description:'Spiele gegen 12 Bots von 400 bis 3000 Elo. Mit Schachuhr, legalen Zügen, Brettdesigns und eigener Engine-Anbindung.',category:'Strategie',path:'games/chess/',icon:'♟',style:'void',thumbnail:'assets/thumbs/zunox-chess.svg'},
 {title:'Wobble Brawl',tag:'NEU',control:'Tastatur / Touch',description:'Wackelige Sumo-Kämpfe auf schwebenden Arenen! Schubse drei Bots runter, schnapp dir verrückte Items und sammle Hüte.',category:'Action',path:'games/wobble-brawl/',icon:'🥊',style:'shooter',thumbnail:'assets/thumbs/wobble-brawl.svg'},
 {title:'Neon Swing',tag:'NEU',control:'Tastatur / Touch',description:'Schwinge dich mit perfektem Timing durch eine endlose Neon-Welt. Hake Anker ein, sammle Energie und jage deinen Rekord.',category:'Arcade',path:'games/neon-swing/',icon:'◉',style:'drift',thumbnail:'assets/thumbs/neon-swing.svg'},
 {title:'Chain Blast',control:'Maus / Touch',description:'Ein einziger Tipp löst eine explosive Kettenreaktion aus. Sammle Punkte, kaufe Upgrades und knacke immer schwierigere Level.',category:'Arcade',path:'chain-blast/',icon:'💥',style:'shooter',thumbnail:'assets/thumbs/chain-blast.svg'},
 
 {title:'Void Survivors',control:'Tastatur / Touch',description:'Überlebe das endlose Void, sammle XP, entwickle sechs Waffen und besiege den Kollektor.',category:'Action',path:'games/void-survivors/',icon:'✧',style:'void',thumbnail:'assets/thumbs/void-survivors.svg'},
 {title:'Gravity Flip',control:'Tastatur / Touch',description:'Ein Neon-Runner mit umkehrbarer Schwerkraft, Stacheln, Sägen, Münzen und Power-ups.',category:'Arcade',path:'games/gravity-flip/',icon:'🟦',style:'drift',thumbnail:'assets/thumbs/gravity-flip.svg'},
 {title:'Neon Orbit',control:'Tastatur / Touch',description:'Wechsle zwischen drei Neon-Umlaufbahnen, weiche Asteroiden und Lasern aus und sammle Energie.',category:'Arcade',path:'neon-orbit/',icon:'🚀',style:'drift',thumbnail:'assets/thumbs/neon-orbit.svg'},
 {title:'Drift Arena',control:'Tastatur / Touch',description:'Top-Down-Rennen mit Handbremse, Reifenspuren, Qualm, Checkpoints und Bestzeiten.',category:'Racing',path:'drift-arena/',icon:'🏁',style:'drift',thumbnail:'assets/thumbs/drift-arena.svg'},
 {title:'Rival Strike',control:'Tastatur / Maus',description:'Rasante Ego-Shooter-Arena: Kämpfe gegen Bots, wechsle Waffen und sammle Kills.',category:'Action',path:'shooter/',icon:'🎯',style:'shooter',thumbnail:'assets/thumbs/rival-strike.svg'},
 {title:'Chicken Valley',control:'Maus / Touch',description:'Kaufe Hühner, sammle Eier, verkaufe sie und baue deinen eigenen Chicken-Tycoon-Hof auf.',category:'Simulation',path:'farm/',icon:'🚜',style:'farm',thumbnail:'assets/thumbs/chicken-valley.svg'}
];
const categories=['Alle',...new Set(GAMES.map(g=>g.category))];let active='Alle';
const filters=document.querySelector('#filters'),grid=document.querySelector('#games'),search=document.querySelector('#search');
categories.forEach(c=>{const b=document.createElement('button');b.className='filter';b.textContent=c;b.setAttribute('aria-pressed',c===active?'true':'false');b.onclick=()=>{active=c;filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.textContent===active)));render();};filters.append(b);});
function render(){const q=search.value.trim().toLocaleLowerCase('de');const list=GAMES.filter(g=>(active==='Alle'||g.category===active)&&(g.title+' '+g.description+' '+g.category).toLocaleLowerCase('de').includes(q));grid.innerHTML='';document.querySelector('#count').textContent=list.length+' Spiele';if(!list.length){grid.innerHTML='<div class="empty">Keine Spiele gefunden. Probiere einen anderen Suchbegriff.</div>';return;}list.forEach(g=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div class="cover '+g.style+'">'+(g.thumbnail?'<img src="'+g.thumbnail+'" alt="'+g.title+' Vorschaubild">':'<span>'+g.icon+'</span>')+'</div><div class="card-body"><div class="meta"><span class="meta-left"><span>'+g.category+'</span>'+(g.tag?'<span class="tag">'+g.tag+'</span>':'')+'</span><span class="control">'+(g.control||'Maus / Touch')+'</span></div><h3></h3><p></p><a class="play" href="'+g.path+'"><span>Jetzt spielen</span><span>↗</span></a></div>';a.querySelector('h3').textContent=g.title;a.querySelector('p').textContent=g.description;grid.append(a);});}
search.addEventListener('input',render);render();
</script></body></html>
