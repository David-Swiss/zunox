<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Neon Assault — Games.com</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090f1b;color:#eaf2ff;font:15px system-ui;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:16px max(18px,calc((100% - 1100px)/2));background:#111d30;border-bottom:1px solid #263950}.top a{color:#9fe9ff;text-decoration:none;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:20px}.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat{background:#142238;border:1px solid #2b405a;border-radius:10px;padding:10px 15px}.stat b{color:#6fffd2}canvas{display:block;width:100%;max-height:68vh;aspect-ratio:16/9;background:radial-gradient(ellipse,#182c43,#080f1b);border:1px solid #39516d;border-radius:14px;touch-action:none}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;color:#aebdd0}.btn{background:#6ce8d0;color:#07151a;border:0;padding:12px 18px;border-radius:9px;font-weight:900;cursor:pointer}.touch{display:none;gap:10px;justify-content:center;margin-top:12px}.touch button{width:68px;height:54px;background:#20364f;color:white;border:1px solid #49627e;border-radius:12px;font-size:22px}@media(pointer:coarse){.touch{display:flex}}@media(max-width:600px){.wrap{padding:12px}.top{padding:14px}.stat{padding:8px 10px;font-size:13px}}
</style></head><body><header class="top"><a href="../">← Alle Spiele</a><strong>NEON ASSAULT</strong><span>ARCADE SHOOTER</span></header><main class="wrap"><div class="hud"><div class="stat">LEBEN <b id="hp">100</b></div><div class="stat">MUNITION <b id="ammo">12 / 12</b></div><div class="stat">WELLE <b id="wave">1</b></div><div class="stat">PUNKTE <b id="score">0</b></div><div class="stat">BESTWERT <b id="best">0</b></div></div><canvas id="game" width="960" height="540" aria-label="Shooter Spielfeld"></canvas><div class="row"><span>WASD / Pfeile bewegen · Maus zielen & schiessen · R nachladen</span><button class="btn" id="start">Spiel starten</button></div><div class="touch"><button data-move="left">◀</button><button data-move="up">▲</button><button data-move="down">▼</button><button data-move="right">▶</button><button id="fire">●</button></div></main>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let player={x:480,y:270,hp:100},keys={},enemies=[],shots=[],score=0,wave=1,ammo=12,reload=0,running=false,last=0,spawn=0,mouse={x:600,y:270},fire=false;
let best=+(localStorage.getItem('neonBest')||0);$('best').textContent=best;
function reset(){player={x:480,y:270,hp:100};enemies=[];shots=[];score=0;wave=1;ammo=12;reload=0;spawn=0;running=true;last=0;$('start').textContent='Neu starten';}
function shoot(){if(!running||reload>0||ammo<=0)return;const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);shots.push({x:player.x,y:player.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,life:1.2});ammo--;}
function reloadGun(){if(reload<=0&&ammo<12)reload=1.05;}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reloadGun();if(e.key===' ')shoot();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pos(e){const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*c.width/r.width;mouse.y=(e.clientY-r.top)*c.height/r.height;}
c.addEventListener('pointermove',pos);c.addEventListener('pointerdown',e=>{pos(e);fire=true;shoot();});addEventListener('pointerup',()=>fire=false);
$('fire').onpointerdown=e=>{e.preventDefault();shoot();};$('start').onclick=reset;
document.querySelectorAll('[data-move]').forEach(b=>{let k=b.dataset.move;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
function spawnEnemy(){const side=Math.floor(Math.random()*4);let x=side===0?0:side===1?960:Math.random()*960,y=side===2?0:side===3?540:Math.random()*540;enemies.push({x,y,hp:2+Math.floor(wave/3),speed:55+wave*5,r:15+Math.random()*5});}
function update(dt){let dx=(keys.d||keys.arrowright||keys.right?1:0)-(keys.a||keys.arrowleft||keys.left?1:0),dy=(keys.s||keys.arrowdown||keys.down?1:0)-(keys.w||keys.arrowup||keys.up?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(18,Math.min(942,player.x+dx/len*245*dt));player.y=Math.max(18,Math.min(522,player.y+dy/len*245*dt));if(reload>0){reload-=dt;if(reload<=0)ammo=12;}spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.28,1.35-wave*.07);}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}shots=shots.filter(s=>s.life>0&&s.x>-20&&s.x<980&&s.y>-20&&s.y<560);for(const e of enemies){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(player.x-e.x,player.y-e.y)<e.r+13){player.hp-=22*dt;}}for(const e of enemies){for(const s of shots){if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+5){e.hp--;s.life=0;if(e.hp<=0){score+=10;}}}}enemies=enemies.filter(e=>e.hp>0);if(score>=wave*100)wave++;if(player.hp<=0){running=false;best=Math.max(best,score);localStorage.setItem('neonBest',best);$('best').textContent=best;$('start').textContent='Erneut spielen';}}
function draw(){ctx.clearRect(0,0,960,540);ctx.strokeStyle='#1d344b';ctx.lineWidth=1;for(let x=0;x<960;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke();}for(let y=0;y<540;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke();}ctx.fillStyle='#5effd4';ctx.shadowColor='#5effd4';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(player.x,player.y,13,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#b8fff0';ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(Math.atan2(mouse.y-player.y,mouse.x-player.x))*25,player.y+Math.sin(Math.atan2(mouse.y-player.y,mouse.x-player.x))*25);ctx.stroke();ctx.fillStyle='#ffe16b';shots.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();});enemies.forEach(e=>{ctx.fillStyle='#ff5578';ctx.shadowColor='#ff315c';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(e.x-12,e.y-e.r-8,24,3);ctx.fillStyle='#ff5578';ctx.fillRect(e.x-12,e.y-e.r-8,24*Math.max(0,e.hp/(2+Math.floor(wave/3))),3);});if(!running){ctx.fillStyle='#07101dcc';ctx.fillRect(0,0,960,540);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText(player.hp<=0?'MISSION GESCHEITERT':'NEON ASSAULT',480,250);ctx.font='18px system-ui';ctx.fillText('Start drücken, um loszulegen',480,285);}}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(running)update(dt);draw();$('hp').textContent=Math.max(0,Math.ceil(player.hp));$('ammo').textContent=reload>0?'Lädt…':ammo+' / 12';$('wave').textContent=wave;$('score').textContent=score;requestAnimationFrame(frame);}requestAnimationFrame(frame);})();
</script></body></html>
